{% extends "base.html" %}

{% block title %}Nuevo Entrenamiento — GymTracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-header__title">Registrar Entrenamiento</h1>
    <p class="page-header__subtitle">Loguea tus series, repeticiones y peso.</p>
</div>

<div class="card form-section">
    <form id="workout-form">
        <div class="form-grid" style="margin-bottom: var(--space-lg);">
            <div class="form-group">
                <label for="workout-date" class="form-label">Fecha</label>
                <input type="date" id="workout-date" name="date" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="routine-select" class="form-label">Rutina (Opcional)</label>
                <select id="routine-select" name="routine_id" class="form-select">
                    <option value="">-- Entrenamiento Libre --</option>
                    {% for r in routines %}
                        <option value="{{ r.id }}">{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="workout-duration" class="form-label">Duración (minutos)</label>
                <input type="number" id="workout-duration" name="duration_minutes" class="form-input" min="1" placeholder="Ej. 60">
            </div>
        </div>

        <h2 class="section__title">Ejercicios y Series</h2>
        
        <div id="workout-exercises">
            <!-- Dynamic exercise blocks will be inserted here -->
        </div>

        <button type="button" id="btn-add-exercise-block" class="btn btn--add-exercise">
            + Añadir Ejercicio
        </button>

        <div class="form-group" style="margin-top: var(--space-xl);">
            <label for="workout-notes" class="form-label">Notas del Entrenamiento</label>
            <textarea id="workout-notes" name="notes" class="form-textarea" placeholder="¿Cómo te sentiste hoy?"></textarea>
        </div>

        <div class="form-actions" style="margin-top: var(--space-xl); justify-content: flex-end;">
            <a href="{{ url_for('workouts.index') }}" class="btn btn--danger-outline">Cancelar</a>
            <button type="submit" id="btn-save-workout" class="btn">Guardar Entrenamiento</button>
        </div>
    </form>
</div>

<!-- Hidden sources for JS to clone -->
<div id="sources" style="display: none;">
    <!-- Ejercicios Select Source -->
    <select id="source-exercise-select">
        <option value="" disabled selected>-- Seleccionar Ejercicio --</option>
        {% for ex in exercises %}
            <option value="{{ ex.id }}">{{ ex.name }} ({{ ex.muscle_group | capitalize }})</option>
        {% endfor %}
    </select>

    <!-- Routine data payload for JS -->
    <script id="source-routines-data" type="application/json">
        {{ routines_json | tojson | safe }}
    </script>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/workouts.js') }}"></script>
{% endblock %}
